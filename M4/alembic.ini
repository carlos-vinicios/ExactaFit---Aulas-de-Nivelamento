# Configuração do Alembic (Aula 5).
# A URL do banco NÃO fica aqui: o migracoes/env.py lê a variável DATABASE_URL
# (padrão: sqlite:///escola.db). Assim o mesmo projeto migra SQLite e PostgreSQL.

[alembic]
script_location = %(here)s/migracoes
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

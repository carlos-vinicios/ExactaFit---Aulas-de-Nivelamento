# Tarefas do projeto (Aula 5). Documentação: https://taskfile.dev
#
#   task            lista as tarefas
#   task setup      instala as dependências
#
# Prática 3: complete as tarefas marcadas com TODO e confira com
#   task --list
#   task --dry --yes db:reset
# comparando com as saídas esperadas em exercicios/aula5/p3_task/enunciado.md.

version: '3'

# Carrega DATABASE_URL (e o que mais houver) do arquivo .env, se ele existir.
dotenv: ['.env']

tasks:
  default:
    desc: Lista as tarefas disponíveis
    cmds:
      - task --list
    silent: true

  setup:
    desc: Instala as dependências do projeto
    cmds:
      - python -m pip install -r requirements-dev.txt

